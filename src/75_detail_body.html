<main id="main">
<article class="detail wrap">
  <header class="detail__head">
    <p class="eyebrow reveal">案例 {{NUM}} / {{TOTAL}}</p>
    <h1 class="reveal" style="--d:60ms">{{TITLE}}</h1>
    <p class="lead reveal" style="--d:120ms">{{SUMMARY}}</p>
    <div class="detail__tags reveal" style="--d:180ms">{{TAGS}}</div>
  </header>

  <figure class="detail__shot detail__hero reveal" style="--d:240ms">
    <span class="detail__frame"><img src="{{HERO_SRC}}" alt="{{HERO_ALT}}" width="1000" height="625" decoding="async"></span>
    <figcaption>{{HERO_CAP}}</figcaption>
  </figure>

  <section class="detail__sec reveal">
    <h2>概览</h2>
    <div class="detail__body">{{OVERVIEW}}</div>
  </section>

  <section class="detail__sec reveal">
    <h2>参数与规模</h2>
    <dl class="facts">{{FACTS}}</dl>
  </section>

  <section class="detail__sec reveal">
    <h2>怎么做的</h2>
    <ol class="steps">{{STEPS}}</ol>
  </section>

  {{GALLERY}}

  <section class="detail__sec reveal">
    <h2>用到的接口</h2>
    <ul class="chips">{{APIS}}</ul>
  </section>

  <nav class="pn" aria-label="案例导航">
    <a class="pn__item" href="{{PREV_HREF}}"><span>上一个</span><b>{{PREV_TITLE}}</b></a>
    <a class="pn__item pn__item--next" href="{{NEXT_HREF}}"><span>下一个</span><b>{{NEXT_TITLE}}</b></a>
  </nav>
</article>
</main>
